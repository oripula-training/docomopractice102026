<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毎朝の5問｜罠クイズ</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F4F5FA;
  --surface: #FFFFFF;
  --ink: #1A2140;
  --muted: #5A6180;
  --line: #D9DDEB;
  --accent: #2B57E8;
  --accent-ink: #FFFFFF;
  --ok: #0E8A63;
  --ng: #C42F49;
  --okbg: #E3F5EE;
  --ngbg: #FBE7EB;
  --facet-empty: #E3E7F3;
  --r0: #8A90A6;
  --r1: #2B57E8;
  --r2: #C42F49;
  --r3: #0E8A63;
  --r4: #2A93B8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1326;
    --surface: #171E3A;
    --ink: #EDEFF8;
    --muted: #A3AACB;
    --line: #2B3459;
    --accent: #7C9DFF;
    --accent-ink: #0E1326;
    --ok: #4FD3A6;
    --ng: #FF7D92;
    --okbg: #12332A;
    --ngbg: #3A1A25;
    --facet-empty: #232C50;
    --r0: #8E94AD;
    --r1: #7C9DFF;
    --r2: #FF7D92;
    --r3: #4FD3A6;
    --r4: #6CCBEA;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1326;
  --surface: #171E3A;
  --ink: #EDEFF8;
  --muted: #A3AACB;
  --line: #2B3459;
  --accent: #7C9DFF;
  --accent-ink: #0E1326;
  --ok: #4FD3A6;
  --ng: #FF7D92;
  --okbg: #12332A;
  --ngbg: #3A1A25;
  --facet-empty: #232C50;
  --r0: #8E94AD;
  --r1: #7C9DFF;
  --r2: #FF7D92;
  --r3: #4FD3A6;
  --r4: #6CCBEA;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", "Meiryo", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}
#app { max-width: 520px; margin: 0 auto; padding: 20px 18px 56px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 14px; }
.step { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.hero { display: grid; justify-items: center; gap: 10px; padding: 8px 0 18px; text-align: center; }
.hero h1 { font-size: 26px; line-height: 1.35; letter-spacing: 0.02em; }
.hero p { color: var(--muted); font-size: 15px; max-width: 24em; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin: 6px 0 16px; }
.seg button { border: 0; background: transparent; padding: 11px 8px; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.cta { width: 100%; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); padding: 16px; font-size: 18px; font-weight: 700; }
.cta:active { transform: translateY(1px); }
.menu { display: grid; gap: 10px; margin-top: 12px; }
.menu button { text-align: left; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; }
.menu strong { display: block; font-size: 16px; }
.menu span { color: var(--muted); font-size: 14px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 22px 0 6px; }
.stat { border-top: 3px solid var(--line); padding-top: 8px; }
.stat.done { border-top-color: var(--ok); }
.stat b { display: block; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12.5px; line-height: 1.5; display: block; }

.section { margin-top: 26px; }
.section h2 { font-size: 16px; margin-bottom: 4px; }
.section p { color: var(--muted); font-size: 14px; }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
.rung { text-align: center; border-bottom: 4px solid var(--c); padding-bottom: 6px; }
.rung b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.rung small { font-size: 11.5px; color: var(--muted); }
.fresh { margin-top: 8px; font-size: 13.5px; color: var(--muted); }

.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 20px 18px; }
.tag { color: var(--muted); font-size: 13.5px; margin-bottom: 10px; }
.q { font-size: 20px; line-height: 1.7; font-weight: 600; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.ans { border: 2px solid var(--line); border-radius: 14px; background: var(--surface); padding: 18px 8px; font-size: 18px; font-weight: 700; }
.ans b { display: block; font-size: 34px; line-height: 1.2; }
.ans:active { transform: translateY(1px); }

.timer { height: 8px; border-radius: 4px; background: var(--facet-empty); overflow: hidden; margin: 14px 0 6px; }
.timer i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; animation: drain 5s linear forwards; }
.timer.stopped i { animation: none; width: 0; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.hint { color: var(--muted); font-size: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.btn { border: 2px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 10px; font-weight: 700; font-size: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; margin-top: 14px; }

.fb { margin-top: 16px; border-radius: 14px; padding: 14px 16px; }
.fb.ok { background: var(--okbg); border: 1.5px solid var(--ok); }
.fb.ng { background: var(--ngbg); border: 1.5px solid var(--ng); }
.fb h3 { font-size: 18px; margin-bottom: 2px; }
.fb.ok h3 { color: var(--ok); }
.fb.ng h3 { color: var(--ng); }
.fb p { font-size: 15px; }
.fb .rank { margin-top: 8px; color: var(--muted); font-size: 14px; }
.answer-box { border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 16px; }

.sum { display: grid; gap: 4px; margin: 6px 0 14px; text-align: center; }
.sum b { font-size: 34px; font-variant-numeric: tabular-nums; }
.wrong-list { display: grid; gap: 10px; margin-top: 12px; }
.wrong-item { border-left: 4px solid var(--ng); padding: 4px 0 4px 12px; font-size: 14.5px; }
.wrong-item small { color: var(--muted); display: block; }
.copybox { margin-top: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; font-size: 14.5px; }
.cases { display: grid; gap: 10px; margin-top: 12px; }
.cases button { text-align: left; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; }
.cases em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.foot { margin-top: 30px; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
.foot button { margin-top: 10px; }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; }

@media (prefers-reduced-motion: reduce) {
  .timer i { animation: none; transform: scaleX(0.5); }
  .ans:active, .cta:active { transform: none; }
}
</style>
</head>

      steps = shuffle(items().filter(function (it) { return it.c === caseNo; })).map(function (it) { return { type: 'quiz', it: it }; });
    } else if (mode === 'review') {
      list = items().filter(function (it) { var s = stOf(it.id); return s && (s.b <= 1 || s.due <= today()); });
      steps = shuffle(list).slice(0, 15).map(function (it) { return { type: 'quiz', it: it }; });
    }
    if (!steps.length) { notice = mode === 'review' ? '復習する問題は、まだありません。先に、罠クイズを解いてください。' : '問題が見つかりません。'; VIEW = 'home'; render(); return; }
    SES = { mode: mode, caseNo: caseNo, steps: steps, i: 0, res: [], phase: 'q', t0: Date.now(), fast: false, info: null };
    VIEW = 'play';
    render();
  }
  function finish() {
    var gOk = 0, gN = 0, qOk = 0, qN = 0;
    SES.res.forEach(function (r) {
      if (r.type === 'gate') { gN++; if (r.ok) gOk++; } else { qN++; if (r.ok) qOk++; }
    });
    SES.sum = { gOk: gOk, gN: gN, qOk: qOk, qN: qN };
    if (SES.mode === 'morning' || SES.mode === 'gate') recordGate(gOk);
    if (SES.mode === 'morning') {
      var t = today();
      S.morning[t] = S.morning[t] || {};
      S.morning[t][S.ver] = SES.res.map(function (r) { return r.ok ? 'ok' : 'ng'; });
      save();
    }
    if (SES.mode === 'all' && qN > 0 && qOk === qN) {
      var d = today();
      if (S.perfect[S.ver].indexOf(d) < 0) { S.perfect[S.ver].push(d); save(); }
    }
    VIEW = 'result';
    render();
  }
  function next() {
    SES.i++;
    if (SES.i >= SES.steps.length) { finish(); return; }
    SES.phase = 'q'; SES.t0 = Date.now(); SES.fast = false; SES.info = null;
    render();
  }

  /* ---------- 画面 ---------- */
  function copyText(text, btn) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); btn.textContent = 'コピーしました'; } catch (e) { btn.textContent = 'コピーできませんでした'; }
      document.body.removeChild(ta);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { btn.textContent = 'コピーしました'; }, fallback);
        return;
      }
    } catch (e) { /* 次の方法で試す */ }
    fallback();
  }
  var resetArmed = false;

  function viewHome() {
    var t = today();
    var m = S.morning[t] && S.morning[t][S.ver];
    var states = m || [];
    var list = items();
    var seen = list.filter(function (it) { return !!stOf(it.id); });
    var dueN = seen.filter(function (it) { return isDue(it.id); }).length;
    var perfect = Math.min(S.perfect[S.ver].length, 2);
    var streak = Math.min(gateStreak(), 3);
    var counts = [0, 0, 0, 0, 0];
    seen.forEach(function (it) { counts[boxOf(it.id)]++; });
    var colors = ['var(--r0)', 'var(--r1)', 'var(--r2)', 'var(--r3)', 'var(--r4)'];

    var wrap = el('div');
    wrap.appendChild(el('div', { class: 'hero' },
      facets(states, 132),
      el('h1', { text: m ? '今日の5問は、完了しました' : '毎朝の5問' }),
      el('p', { text: m ? 'もう一度やると、別の問題が出ます。' : 'Gate1の4問と、罠クイズ1問。5分で終わります。' })
    ));
    var seg = el('div', { class: 'seg', role: 'group', 'aria-label': '版を選ぶ' });
    ['sbym', 'docomo'].forEach(function (v) {
      seg.appendChild(el('button', { type: 'button', 'aria-pressed': S.ver === v ? 'true' : 'false', text: LABEL[v], onclick: function () { S.ver = v; save(); notice = ''; render(); } }));
    });
    wrap.appendChild(seg);
    if (notice) wrap.appendChild(el('p', { class: 'hint', text: notice, role: 'status' }));
    wrap.appendChild(el('button', { class: 'cta', type: 'button', text: m ? '朝の5問を、もう一度やる' : '朝の5問を始める', onclick: function () { notice = ''; start('morning'); } }));
    wrap.appendChild(el('div', { class: 'menu' },
      menuBtn('Gate1だけ（5秒ドリル）', 'ロープレテストの口頭試問4問を、5秒で答える', function () { start('gate'); }),
      menuBtn('罠クイズ（全' + list.length + '問）', '満点を、別の日に2回取る', function () { start('all'); }),
      menuBtn('ケース別に解く', '案内テストのケースごとに、○×を解く', function () { VIEW = 'cases'; render(); }),
      menuBtn('間違えた問題・復習', '間違えた問題と、復習の日が来た問題（最大15問）', function () { start('review'); })
    ));
    wrap.appendChild(el('div', { class: 'stats' },
      stat(perfect >= 2, perfect + ' / 2回', '罠クイズの満点（別の日）'),
      stat(streak >= 3, streak + ' / 3日', 'Gate1が4/4の連続'),
      stat(false, dueN + '問', '復習の日が来た問題')
    ));
    var lad = el('div', { class: 'ladder' });
    RANKS.forEach(function (r, i) {
      var rung = el('div', { class: 'rung' }, el('b', { text: String(counts[i]) }), el('small', { text: r }));
      rung.style.setProperty('--c', colors[i]);
      lad.appendChild(rung);
    });
    wrap.appendChild(el('div', { class: 'section' },
      el('h2', { text: '石の磨き具合' }),
      el('p', { text: '正解するたびに、石が一段磨かれます。間違えると、原石に戻ります。復習は、1日後・3日後・7日後・14日後に出ます。' }),
      lad,
      el('p', { class: 'fresh', text: 'まだ解いていない問題：' + (list.length - seen.length) + '問' })
    ));
    var foot = el('div', { class: 'foot' },
      el('p', { text: '出典：案内テスト 講師・採点者用マニュアル（2026年10月版）、クローザーロープレ 運営・採点マニュアル。料金・制度・施策は変わります。現行の案内テスト資料と食い違うときは、案内テスト資料を正としてください。記録は、この端末のブラウザに保存されます。' })
    );
    var rb = el('button', { class: 'link', type: 'button', text: '記録を消す', onclick: function () {
      if (!resetArmed) { resetArmed = true; rb.textContent = '本当に消す（もう一度押す）'; setTimeout(function () { resetArmed = false; rb.textContent = '記録を消す'; }, 4000); return; }
      resetArmed = false; var v = S.ver; S = fresh(); S.ver = v; save(); notice = '記録を消しました。'; render();
    } });
    foot.appendChild(rb);
    wrap.appendChild(foot);
    return wrap;
  }
  function menuBtn(title, sub, fn) {
    return el('button', { type: 'button', onclick: fn }, el('strong', { text: title }), el('span', { text: sub }));
  }
  function stat(done, big, small) {
    return el('div', { class: 'stat' + (done ? ' done' : '') }, el('b', { text: big }), el('small', { text: small }));
  }

  function viewCases() {
    var wrap = el('div');
    wrap.appendChild(el('div', { class: 'top' },
      el('button', { class: 'link', type: 'button', text: '← 戻る', onclick: function () { VIEW = 'home'; render(); } }),
      el('span', { class: 'step', text: LABEL[S.ver] })
    ));
    wrap.appendChild(el('h2', { text: 'ケースを選ぶ' }));
    var box = el('div', { class: 'cases' });
    Object.keys(CASES[S.ver]).forEach(function (k) {
      var n = Number(k);
      var cnt = items().filter(function (it) { return it.c === n; }).length;
      var label = (n === 0 ? '' : 'ケース' + n + '｜') + CASES[S.ver][k];
      box.appendChild(el('button', { type: 'button', onclick: function () { start('case', n); } }, el('span', { text: label }), el('em', { text: cnt + '問' })));
    });
    wrap.appendChild(box);
    return wrap;
  }

  function topBar() {
    var n = SES.steps.length;
    return el('div', { class: 'top' },
      el('button', { class: 'link', type: 'button', text: '← やめる', onclick: function () { VIEW = 'home'; SES = null; render(); } }),
      el('span', { class: 'step', text: (SES.i + 1) + ' / ' + n })
    );
  }

  function viewPlay() {
    var s = SES.steps[SES.i];
    var wrap = el('div');
    wrap.appendChild(topBar());
    if (s.type === 'gate') return playGate(wrap, s);
    return playQuiz(wrap, s);
  }

  function playGate(wrap, s) {
    var card = el('div', { class: 'card' });
    card.appendChild(el('p', { class: 'tag', text: 'Gate1　' + LABEL[S.ver] }));
    card.appendChild(el('p', { class: 'q', text: s.g.q }));
    if (SES.phase === 'q') {
      card.appendChild(el('div', { class: 'timer', 'aria-hidden': 'true' }, el('i')));
      card.appendChild(el('p', { class: 'hint', text: '5秒以内に、声に出して答えてから、「答えを見る」を押します。' }));
      wrap.appendChild(card);
      wrap.appendChild(el('button', { class: 'btn primary wide', type: 'button', text: '答えを見る', onclick: function () {
        SES.fast = (Date.now() - SES.t0) <= 5200;
        SES.phase = 'a'; render();
      } }));
      return wrap;
    }
    card.appendChild(el('div', { class: 'timer stopped', 'aria-hidden': 'true' }, el('i')));
    card.appendChild(el('div', { class: 'answer-box', text: s.g.a }));
    wrap.appendChild(card);
    if (!SES.fast) {
      wrap.appendChild(el('p', { class: 'hint', style: 'margin-top:12px', text: '5秒を超えたので、「言えなかった」として記録します。' }));
      wrap.appendChild(el('button', { class: 'btn primary wide', type: 'button', text: '次へ', onclick: function () { SES.res.push({ type: 'gate', ok: false }); next(); } }));
    } else {
      wrap.appendChild(el('p', { class: 'hint', style: 'margin-top:12px', text: '5秒以内に、答えの内容を、声に出して言えましたか？' }));
      wrap.appendChild(el('div', { class: 'row2' },
        el('button', { class: 'btn primary', type: 'button', text: '言えた', onclick: function () { SES.res.push({ type: 'gate', ok: true }); next(); } }),
        el('button', { class: 'btn', type: 'button', text: '言えなかった', onclick: function () { SES.res.push({ type: 'gate', ok: false }); next(); } })
      ));
    }
    return wrap;
  }

  function playQuiz(wrap, s) {
    var it = s.it;
    var card = el('div', { class: 'card' });
    card.appendChild(el('p', { class: 'tag', text: (it.c === 0 ? '' : 'ケース' + it.c + '｜') + CASES[S.ver][it.c] }));
    card.appendChild(el('p', { class: 'q', text: it.q }));
    wrap.appendChild(card);
    if (SES.phase === 'q') {
      wrap.appendChild(el('div', { class: 'answers' },
        el('button', { class: 'ans', type: 'button', 'aria-label': '正しい', onclick: function () { answer(it, true); } }, el('b', { text: '○' }), '正しい'),
        el('button', { class: 'ans', type: 'button', 'aria-label': '誤り', onclick: function () { answer(it, false); } }, el('b', { text: '×' }), '誤り')
      ));
      return wrap;
    }
    var ok = SES.info.ok;
    var fb = el('div', { class: 'fb ' + (ok ? 'ok' : 'ng'), role: 'status' },
      el('h3', { text: ok ? '正解です' : '不正解です' }),
      el('p', { text: '答え：' + (it.a ? '○（正しい）' : '×（誤り）') }),
      el('p', { text: it.e }),
      el('p', { class: 'rank', text: ok ? 'この石は、' + RANKS[SES.info.before] + (SES.info.after > SES.info.before ? ' → ' + RANKS[SES.info.after] + ' に磨かれました。' : ' のままです（最上位）。') : 'この石は、原石に戻りました。明日、もう一度出ます。' })
    );
    wrap.appendChild(fb);
    wrap.appendChild(el('button', { class: 'btn primary wide', type: 'button', text: SES.i + 1 >= SES.steps.length ? '結果を見る' : '次へ', onclick: next }));
    return wrap;
  }
  function answer(it, choice) {
    var ok = (choice === it.a);
    var g = grade(it.id, ok);
    SES.info = { ok: ok, before: g.before, after: g.after };
    SES.res.push({ type: 'quiz', ok: ok, it: it });
    SES.phase = 'a';
    render();
  }

  function viewResult() {
    var m = SES.mode, sum = SES.sum;
    var total = sum.gN + sum.qN, ok = sum.gOk + sum.qOk;
    var wrap = el('div');
    wrap.appendChild(el('div', { class: 'top' }, el('span', { class: 'step', text: LABEL[S.ver] }), el('span')));
    var states = SES.res.slice(0, 5).map(function (r) { return r.ok ? 'ok' : 'ng'; });
    var hero = el('div', { class: 'hero' });
    if (m === 'morning') hero.appendChild(facets(states, 132));
    hero.appendChild(el('div', { class: 'sum' }, el('b', { text: ok + ' / ' + total }), el('span', { text: '問 正解' })));
    wrap.appendChild(hero);

    var lines = [];
    if (sum.gN) lines.push('Gate1：' + sum.gOk + ' / ' + sum.gN + (sum.gOk >= 4 ? '　全問、5秒以内に言えました' : ''));
    if (sum.qN) lines.push('罠クイズ：' + sum.qOk + ' / ' + sum.qN);
    var status = el('div', { class: 'card' });
    lines.forEach(function (l) { status.appendChild(el('p', { text: l })); });
    if (m === 'all' && sum.qOk === sum.qN) status.appendChild(el('p', { text: '満点です。別の日にも、もう一度満点を取ると、2回達成です（いまの満点：' + Math.min(S.perfect[S.ver].length, 2) + ' / 2回）。' }));
    if (m === 'gate' || m === 'morning') status.appendChild(el('p', { class: 'hint', text: 'Gate1が4/4の連続：' + Math.min(gateStreak(), 3) + ' / 3日' }));
    wrap.appendChild(status);

    var wrong = SES.res.filter(function (r) { return r.type === 'quiz' && !r.ok; });
    if (wrong.length) {
      wrap.appendChild(el('h2', { style: 'margin-top:22px;font-size:16px', text: '間違えた問題' }));
      var wl = el('div', { class: 'wrong-list' });
      wrong.forEach(function (r) {
        wl.appendChild(el('div', { class: 'wrong-item' }, el('small', { text: (r.it.c === 0 ? '' : 'ケース' + r.it.c + '｜') + CASES[S.ver][r.it.c] }), r.it.q, el('small', { text: '答え：' + (r.it.a ? '○' : '×') + '　' + r.it.e })));
      });
      wrap.appendChild(wl);
    }

    var text;
    if (m === 'morning') text = '朝の5問（' + LABEL[S.ver] + '）：Gate1 ' + sum.gOk + '/' + sum.gN + '、罠クイズ ' + (sum.qOk ? '○' : '×') + '（合計 ' + ok + '/' + total + '）';
    else if (m === 'gate') text = 'Gate1ドリル（' + LABEL[S.ver] + '）：' + sum.gOk + '/' + sum.gN;
    else text = '罠クイズ（' + LABEL[S.ver] + (m === 'case' ? '・ケース' + SES.caseNo : '') + '）：' + sum.qOk + '/' + sum.qN;
    var cb = el('button', { class: 'btn wide', type: 'button', text: '日報に貼る文をコピー', onclick: function () { copyText(text, cb); } });
    wrap.appendChild(el('div', { class: 'copybox', text: text }));
    wrap.appendChild(cb);
    wrap.appendChild(el('button', { class: 'btn primary wide', type: 'button', text: 'ホームへ', onclick: function () { VIEW = 'home'; SES = null; render(); } }));
    return wrap;
  }

  function render() {
    var app = document.getElementById('app');
    while (app.firstChild) app.removeChild(app.firstChild);
    var node;
    if (VIEW === 'play' && SES) node = viewPlay();
    else if (VIEW === 'result' && SES) node = viewResult();
    else if (VIEW === 'cases') node = viewCases();
    else node = viewHome();
    app.appendChild(node);
    window.scrollTo(0, 0);
  }

  render();
})();
</script>
</body>
</html>
